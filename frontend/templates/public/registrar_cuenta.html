<!---------- REGISTRATE ---------->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - NAZA</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/public.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="login-body">

<div class="login-container">

    <a href="{{ url_for('login.login_cliente') }}" class="volver-login">
        <i class="bi bi-arrow-left"></i>
    </a>

    <div class="login-card registro-card">

        <div class="login-logo">
            <span>{{ config.nombre }}</span>
        </div>

        {% with mensajes = get_flashed_messages() %}
            {% if mensajes %}
                <div class="login-error">
                    {% for mensaje in mensajes %}
                        <p>{{ mensaje }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="login-campos">
                <label for="nombre">NOMBRE</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="login-campos">
                <label for="apellido">APELLIDO</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>

            <div class="login-campos">
                <label for="email">EMAIL</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="login-campos">
                <label for="telefono">TELÉFONO</label>
                <input type="telefono" id="telefono" name="telefono" required>
            </div>


            <div class="login-campos">
                <label for="contrasena">CONTRASEÑA</label>

                <div class="login-password-wrapper">
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="••••••••"
                        required
                    >

                    <button
                        type="button"
                        class="login-toggle-password"
                        onclick="togglePassword('contrasena','icono-ojo-1')">
                        <i class="bi bi-eye" id="icono-ojo-1"></i>
                    </button>
                </div>
            </div>

            <div class="login-campos">
                <label for="confirmar">CONFIRMAR CONTRASEÑA</label>

                <div class="login-password-wrapper">
                    <input
                        type="password"
                        id="confirmar"
                        name="confirmar"
                        placeholder="••••••••"
                        required
                    >

                    <button
                        type="button"
                        class="login-toggle-password"
                        onclick="togglePassword('confirmar','icono-ojo-2')">
                        <i class="bi bi-eye" id="icono-ojo-2"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-button">
                CREAR CUENTA
            </button>

        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='scripts/script.js') }}"></script>

</body>

</html>
