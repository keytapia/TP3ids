<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block titulo %}
            Naza - Restaurante
        {% endblock %}
    </title>
    
    <link rel="icon"
          type="image/x-icon"
          href="{{ url_for('static', filename='images/favicon.ico', _external=True) }}">
    
    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles/public.css', _external=True) }}">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>
    <header>

        <nav class="navbar">

            <div id="logo">

                <img src="{{ url_for('static', filename='images/logo.png', _external=True) }}">

            </div>


            <ul class="nav-links">

                <li>
                    <a href="{{ url_for('inicio.inicio', _external=True) }}">
                        INICIO
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('menu.menu', _external=True) }}">
                        MENÚ
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('reservas.reservas', _external=True) }}">
                        RESERVAS
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('reseñas.reseñas', _external=True) }}">
                        RESEÑAS
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('nosotros.nosotros', _external=True) }}">
                        NOSOTROS
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('contacto.contacto', _external=True) }}">
                        CONTACTO
                    </a>
                </li>

            </ul>

            <a class="boton-reserva"
            href="{{ url_for('reservas.reservas') }}">
                RESERVAR MESA
            </a>

        </nav>
    </header>

    <main>
        {% block contenido_body %}{% endblock %}
    </main>

    <footer>
        <p>
            &copy; 2026 NAZA RESTAURANTE - 
            <a href="{{ url_for('login.login', _external=True) }}">
                ACCESO STAFF
            </a>
        </p>
    </footer>

    <script src="{{ url_for('static', filename='scripts/script.js', _external=True) }}"></script>
</body>

</html>
