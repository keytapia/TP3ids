<!---------- Login ---------->
{% extends "base.html" %}

{% block titulo %}Login{% endblock %}

{% block contenido_body %}
<div class="login-container">

    <div class="login-card">

        <img src="{{ url_for('static', filename='images/logo.png') }}" class="login-logo _external=True">

        <form method="POST">

            

            <label for="email">
                EMAIL
            </label>

            <input
                type="email"
                id="email"
                name="email"
                
                
            >

            <label for="contrasena">
                CONTRASEÑA
            </label>

            <input
                type="password"
                id="contrasena"
                name="contrasena"
                placeholder="********"
                
            >

            <a href="#">
                ¿Olvidaste tu contraseña?
            </a>

            <button type="submit">
                INICIAR SESIÓN
            </button>

        </form>

    </div>

</div>
{% endblock %}
