{% extends "base.html" %}

{% block titulo %}
Crear Reseña - Naza Restaurante
{% endblock %}

{% block contenido_body %}

<section class="resena-section">

    <div class="resena-container">

        <h1>Dejanos tu reseña</h1>

        <p class="resena-subtitulo">
            Contanos cómo fue tu experiencia en nuestro restaurante.
        </p>

        <form id="form-resena" class="resena-form">

            <div class="form-group">
                <label for="nombre_usuario">
                    Nombre de usuario
                </label>

                <input
                    type="text"
                    id="nombre_usuario"
                    name="nombre_usuario"
                    required
                >
            </div>

            <div class="form-group">
                <label for="reserva_id">
                    ID de la reserva
                </label>

                <input
                    type="number"
                    id="reserva_id"
                    name="reserva_id"
                    required
                >
            </div>

            <div class="form-group">
                <label>
                    Puntuación
                </label>

                <div class="rating">

                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>

                </div>

                <input
                    type="hidden"
                    id="puntuacion"
                    value="0"
                    required
                >
            </div>

            <div class="form-group">
                <label for="comentario">
                    Comentario
                </label>

                <textarea
                    id="comentario"
                    name="comentario"
                    rows="5"
                    required
                ></textarea>
            </div>

            <button type="submit" class="btn-enviar">
                Enviar reseña
            </button>

        </form>

        <div id="mensaje"></div>

    </div>

</section>

<script src="{{ url_for('static', filename='scripts/resenas.js') }}"></script>

{% endblock %}
