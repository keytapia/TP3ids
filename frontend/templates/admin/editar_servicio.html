{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='styles/admin.css') }}">

<div class="pagina-admin-form">
    <div class="editar-agregar-container">
        <form action="{{ url_for('menu_admin.menu_editar_servicio', id=servicio.id) }}" method="POST" enctype="multipart/form-data">

            <label>Nombre</label>
            <input type="text" name="nombre" value="{{ servicio.nombre }}">

            <label>Descripcion</label>
            <textarea name="descripcion">{{ servicio.descripcion }}</textarea>

            <label>Disponible</label>
            <select name="estado">
                <option value="si" {% if servicio.estado == 'si' %}selected{% endif %} >
                    si
                </option>
                <option value="no" {% if servicio.estado == 'no' %}selected{% endif %} >
                    no
                </option>
            </select>
            <button type="submit">Guardar cambios</button>




        </form>
    </div>
</div>


{% endblock %}
