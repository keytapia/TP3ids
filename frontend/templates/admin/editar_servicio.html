{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='styles/admin.css') }}">

<div class="pagina-admin-form">
    <div class="editar-agregar-container">
        <form action="{{ url_for('servicios_admin.editar_servicio', id=id) }}" method="POST", enctype="multipart/form-data" >

            <label>Nombre</label>
            <input type="text" name="nombre">


            <label>Disponibilidad</label>
            <select name="disponible" id="disponible">
                <option value="si" {% if disponible == 'si' %}selected{% endif %}>Sí</option>
                <option value="no" {% if disponible == 'no' %}selected{% endif %}>No</option>
            </select>




            <button type="submit">Guardar cambios</button>

            




        </form>
    </div>
</div>


{% endblock %}
